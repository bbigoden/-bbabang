<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset=".45" stop-color="#f0b429"/>
      <stop offset="1" stop-color="#9a5b00"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d99a1e"/>
      <stop offset="1" stop-color="#6e3d00"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff59d"/>
      <stop offset=".6" stop-color="#ff7a00"/>
      <stop offset="1" stop-color="#c41a00"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" fill="url(#bg)"/>
  <circle cx="128" cy="124" r="110" fill="url(#glow)"/>

  <!-- 몸통 고리 (뒤) -->
  <path d="M40 214 C 20 160, 40 92, 92 70" fill="none" stroke="url(#goldDark)" stroke-width="22" stroke-linecap="round"/>
  <path d="M40 214 C 20 160, 40 92, 92 70" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="22" stroke-dasharray="4 9" stroke-linecap="butt"/>
  <!-- 등지느러미 -->
  <g fill="#c4161c">
    <path d="M28 182 l-16 -6 l14 -8z"/>
    <path d="M26 150 l-17 -2 l13 -11z"/>
    <path d="M34 120 l-15 -7 l16 -7z"/>
    <path d="M50 94 l-12 -12 l18 -3z"/>
    <path d="M70 76 l-6 -16 l17 5z"/>
  </g>

  <!-- 뿔 -->
  <path d="M120 70 C 112 40, 128 18, 156 12 C 140 28, 136 46, 140 66z" fill="url(#gold)"/>
  <path d="M98 78 C 82 54, 88 30, 108 18 C 100 36, 102 54, 114 70z" fill="url(#goldDark)"/>

  <!-- 갈기 -->
  <g fill="#c4161c">
    <path d="M92 92 C 66 82, 58 104, 44 100 C 58 112, 72 118, 96 112z"/>
    <path d="M100 116 C 74 116, 70 140, 52 140 C 68 150, 86 150, 106 136z"/>
    <path d="M110 138 C 92 146, 94 168, 78 174 C 96 178, 112 170, 122 152z"/>
  </g>

  <!-- 머리 -->
  <path d="M96 84
           C 124 62, 166 62, 194 82
           C 210 92, 230 100, 238 116
           C 240 124, 234 130, 224 130
           L 196 132
           C 186 146, 166 158, 140 160
           C 116 162, 98 150, 92 130
           C 88 114, 88 96, 96 84z" fill="url(#gold)"/>
  <!-- 아래턱 -->
  <path d="M140 160 C 168 158, 196 150, 214 140 C 206 156, 186 172, 160 176 C 146 178, 134 172, 128 162z" fill="url(#goldDark)"/>
  <!-- 이빨 -->
  <g fill="#fff8e1">
    <path d="M200 132 l4 10 l4 -10z"/>
    <path d="M182 136 l4 10 l4 -10z"/>
    <path d="M164 140 l3 9 l4 -9z"/>
  </g>
  <!-- 콧구멍·주름 -->
  <ellipse cx="226" cy="114" rx="4" ry="3" fill="#3a1d00"/>
  <path d="M120 96 C 140 86, 164 86, 180 94" fill="none" stroke="#7a4300" stroke-width="3" stroke-linecap="round"/>
  <path d="M112 132 C 124 142, 140 146, 156 144" fill="none" stroke="#7a4300" stroke-width="3" stroke-linecap="round"/>
  <!-- 비늘 무늬 -->
  <g fill="none" stroke="#9a5b00" stroke-width="2" opacity=".7">
    <path d="M104 104 q6 6 12 0"/><path d="M104 118 q6 6 12 0"/><path d="M116 111 q6 6 12 0"/>
  </g>
  <!-- 수염 -->
  <path d="M214 132 C 226 160, 210 186, 228 214" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  <path d="M232 120 C 250 138, 244 160, 252 176" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>

  <!-- 눈 -->
  <path d="M150 98 C 160 88, 178 88, 186 100 C 176 108, 160 108, 150 98z" fill="url(#eye)"/>
  <path d="M168 91 C 166 96, 166 102, 168 107 C 170 102, 170 96, 168 91z" fill="#1a0000"/>
  <path d="M146 92 C 160 78, 182 80, 192 94" fill="none" stroke="#3a1d00" stroke-width="4" stroke-linecap="round"/>

  <!-- 여의주 -->
  <circle cx="74" cy="196" r="20" fill="url(#eye)"/>
  <circle cx="68" cy="190" r="6" fill="#fff" opacity=".6"/>
</svg>
