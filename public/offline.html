<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오프라인 - 빠방</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F9FAFB;
      color: #111827;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: white;
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 50px -10px rgba(0,0,0,0.12);
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      background: #E8EBF2;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 32px;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.375rem;
      font-weight: 700;
    }
    p {
      margin: 0 0 1.5rem;
      color: #6B7280;
      font-size: 0.9375rem;
      line-height: 1.5;
    }
    button {
      width: 100%;
      padding: 0.875rem;
      background: #14274e;
      color: white;
      border: none;
      border-radius: 0.75rem;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #0f1d3a; }
    .hint {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #9CA3AF;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>네트워크에 연결되지 않았어요</h1>
    <p>인터넷 연결을 확인하고 다시 시도해주세요. 이전에 본 페이지는 캐시에서 그대로 볼 수 있어요.</p>
    <button onclick="location.reload()">다시 시도</button>
    <div class="hint">빠방 • Service Worker 캐시</div>
  </div>
</body>
</html>
