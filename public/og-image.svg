<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 우측 밝은 배경 -->
  <rect width="1200" height="630" fill="#F9FAFB"/>

  <!-- 좌측 네이비 그라디언트 블록 -->
  <rect width="600" height="630" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14274e"/>
      <stop offset="100%" stop-color="#0a1d40"/>
    </linearGradient>
  </defs>

  <!-- Bb 아이콘 박스 (흰 배경 + 네이비 Bb, PWA 아이콘과 인버트) -->
  <rect x="80" y="160" width="160" height="160" rx="32" fill="white"/>
  <text x="160" y="240" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="110" text-anchor="middle" dominant-baseline="central" fill="#14274e" letter-spacing="-6">Bb</text>

  <!-- "빠방" 한글 큰 글자 -->
  <text x="80" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', '맑은 고딕', sans-serif" font-weight="900" font-size="84" fill="white">빠방</text>
  <text x="80" y="464" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', '맑은 고딕', sans-serif" font-weight="500" font-size="24" fill="white" fill-opacity="0.82">부동산 역경매 매칭 플랫폼</text>

  <!-- 우측 메인 카피 -->
  <text x="660" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', '맑은 고딕', sans-serif" font-weight="700" font-size="40" fill="#111827">조건만 올리면</text>
  <text x="660" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', '맑은 고딕', sans-serif" font-weight="700" font-size="40" fill="#111827">공인중개사가</text>
  <text x="660" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', '맑은 고딕', sans-serif" font-weight="900" font-size="40" fill="#14274e">먼저 제안해드립니다</text>

  <!-- 태그 -->
  <rect x="660" y="396" width="100" height="40" rx="20" fill="#14274e"/>
  <text x="710" y="422" font-family="-apple-system, 'Malgun Gothic', '맑은 고딕', sans-serif" font-weight="700" font-size="16" text-anchor="middle" fill="white">전세</text>

  <rect x="775" y="396" width="100" height="40" rx="20" fill="#14274e"/>
  <text x="825" y="422" font-family="-apple-system, 'Malgun Gothic', '맑은 고딕', sans-serif" font-weight="700" font-size="16" text-anchor="middle" fill="white">월세</text>

  <rect x="890" y="396" width="100" height="40" rx="20" fill="#14274e"/>
  <text x="940" y="422" font-family="-apple-system, 'Malgun Gothic', '맑은 고딕', sans-serif" font-weight="700" font-size="16" text-anchor="middle" fill="white">매매</text>

  <!-- URL -->
  <text x="660" y="510" font-family="-apple-system, 'Malgun Gothic', '맑은 고딕', sans-serif" font-size="20" fill="#6B7280">bbabang.vercel.app</text>
</svg>
