  <text x="710" y="413" font-family="Arial" font-size="16" text-anchor="middle" fill="#1D4ED8">전세</text>

  <rect x="775" y="390" width="100" height="36" rx="18" fill="#DBEAFE"/>
  <text x="825" y="413" font-family="Arial" font-size="16" text-anchor="middle" fill="#1D4ED8">월세</text>

  <rect x="890" y="390" width="100" height="36" rx="18" fill="#DBEAFE"/>
  <text x="940" y="413" font-family="Arial" font-size="16" text-anchor="middle" fill="#1D4ED8">매매</text>

  <!-- URL -->
